# /etc/nginx/conf.d/zongce.conf
# 综测查询系统反向代理（可选层：DCDN 已终结 HTTPS 时可回源直连 node:3000，
# 但建议保留 nginx —— 压缩、慢客户端缓冲、访问日志、兜底限流都在这层做）

server {
    listen 80;
    server_name zongce.example.edu.cn;   # ← 换成实际域名

    # 阿里云 DCDN 回源会带 X-Forwarded-For；生产建议把 set_real_ip_from
    # 换成阿里云 DCDN 官方回源网段 https://help.aliyun.com/document_detail/102614.html
    set_real_ip_from 0.0.0.0/0;
    real_ip_header   X-Forwarded-For;

    # ---- 压缩（静态资源文件名带 hash，压缩后由 DCDN 边缘缓存） ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---- 连接与超时 ----
    keepalive_timeout 65s;
    keepalive_requests 1000;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # ---- 兜底限流（正常用户碰不到；node 里还有一层更精细的） ----
    limit_req_zone $binary_remote_addr zone=zongce_api:10m rate=30r/s;

    # API：动态回源，不缓存
    location /api/ {
        limit_req zone=zongce_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    # 静态 + SPA：node 已输出 immutable 长缓存头（index.html no-cache），DCDN 按头缓存
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
